[project]
name = "nushell-lfm"
version = "0.1.0"
description = "Generate a Nushell tool-call dataset from seeds and fine-tune LFM3 1.7B on it with MLX; scored by executing the calls."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mlx==0.32.4",
    "mlx-lm==0.31.3",
    "mlx-vlm==0.7.11",
    "transformers==5.20.2",
    "marimo>=0.13.0",
    "altair>=5.5.0",
    "pandas>=2.2.0",
    "anywidget>=0.9.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.22.0",
    "faker>=30.0.0",
    "polyfactory>=2.18.0",
    "networkx>=3.2",
    "wigglystuff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nushell_lfm*"]
