[package]
name = "nu-wasm"
version = "0.1.0"
edition = "2021"
description = "Nushell in WebAssembly with an in-memory workspace, for running tool calls in the browser"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Same release as the native nu the dataset is verified with.
nu-protocol = { version = "=0.117.0", default-features = false }
nu-engine = { version = "=0.117.0", default-features = false }
nu-parser = { version = "=0.117.0", default-features = false }
nu-cmd-lang = { version = "=0.117.0", default-features = false }
nu-command = { version = "=0.117.0", default-features = false }
wasm-bindgen = "0.2"
serde_json = "1"
chrono = { version = "0.4", default-features = false }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
