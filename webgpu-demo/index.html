<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nushell assistant</title>
  <style>
    :root { --term: #14161a; --term-ink: #d7dae0; --term-dim: #8b929c; --term-line: #2a2e35; --ask: #e0a84b; --nu: #6cc08b; --err: #ef8a62; --ok: #6cc08b; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--term); }
    .term { height: 100%; color: var(--term-ink); display: flex; flex-direction: column; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    #scroll { flex: 1; overflow: auto; padding: 20px 24px 8px; }
    .entry { margin-bottom: 12px; }
    .line { white-space: pre-wrap; overflow-wrap: anywhere; }
    .out { white-space: pre; overflow-x: auto; line-height: 1.2; scrollbar-width: thin; scrollbar-color: var(--term-line) transparent; }
    .dim { color: var(--term-dim); }
    .banner { white-space: pre; line-height: 1.15; color: var(--nu); }
    .choice { cursor: pointer; } .choice:hover { color: #fff; } .choice b { color: var(--ask); font-weight: 400; }
    .who-ask { color: var(--ask); } .who-nu { color: var(--nu); } .err { color: var(--err); } .good { color: var(--ok); }
    .inputrow { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--term-line); padding: 12px 24px; }
    #mode { font: inherit; border-radius: 5px; padding: 2px 9px; border: 1px solid currentColor; background: transparent; min-width: 4.2em; cursor: pointer; }
    #mode.ask { color: var(--ask); } #mode.nu { color: var(--nu); }
    #input { flex: 1; min-width: 0; font: inherit; color: var(--term-ink); background: transparent; border: 0; outline: 0; }
    #status { color: var(--term-dim); font-size: 12px; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="term">
    <div id="scroll" aria-live="polite"></div>
    <div class="inputrow">
      <button id="mode" class="ask">ask</button>
      <input id="input" autocomplete="off" spellcheck="false" />
      <span id="status"></span>
    </div>
  </div>
  <script type="module">
    import { AutoModelForCausalLM, AutoTokenizer, TextStreamer, env } from "./node_modules/@huggingface/transformers/dist/transformers.min.js";
    import initNu, * as nu from "./nu-wasm/nu_wasm.js";

    // Where the model comes from is in config.json (or ?model=): a folder under ./models/, served from this
    // machine, or an "owner/name" repository on the Hugging Face Hub for a deployed copy of this page.
    const config = await fetch("config.json").then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
    const MODEL = new URLSearchParams(location.search).get("model") || config.model || "nushell-lfm3-1.7b";
    const remote = MODEL.includes("/");
    env.allowRemoteModels = remote;
    env.allowLocalModels = !remote;
    env.useBrowserCache = remote;  // a local model is not cached: a cached copy would outlive a new export
    env.localModelPath = "./models/";
    env.backends.onnx.wasm.wasmPaths = new URL("./node_modules/onnxruntime-web/dist/", location.href).href;

    const $ = (id) => document.getElementById(id);
    const [format, environments] = await Promise.all(["prompt_format.json", "environments.json"].map((f) => fetch(f).then((r) => r.json())));
    await initNu();

    const device = navigator.gpu ? "webgpu" : "wasm";
    const state = { env: null, mode: "ask", history: [], at: 0, busy: false, loaded: { id: null } };
    const status = (text) => { $("status").textContent = text; };

    // ---- terminal ---------------------------------------------------------------------------------
    function entry() {
      const box = document.createElement("div");
      box.className = "entry";
      $("scroll").append(box);
      return box;
    }
    function line(box, text, cls = "") {
      const el = document.createElement("div");
      el.className = `line ${cls}`;
      el.textContent = text;
      box.append(el);
      $("scroll").scrollTop = $("scroll").scrollHeight;
      return el;
    }
    function prompt(box, who, cls, text) {
      const el = line(box, "");
      const tag = document.createElement("span");
      tag.className = cls;
      tag.textContent = `${who} ❯ `;
      el.append(tag, document.createTextNode(text));
      return el;
    }
    const cwd = () => JSON.parse(nu.session_run("pwd")).stdout.replace(/^\/workspace/, "~") || "~";

    function runNu(box, code) {
      const result = JSON.parse(nu.session_run(code));
      const text = result.ok ? result.stdout : result.stderr;
      if (text) line(box, text, result.ok ? "out" : "err");
      if (result.changed.length) line(box, `wrote ${result.changed.join(", ")}`, "dim");
      return result;
    }

    // ---- model ------------------------------------------------------------------------------------
    async function load(id) {
      if (state.loaded.id === id) return state.loaded;
      status(`Loading the model on ${device === "webgpu" ? "WebGPU" : "WebAssembly (no WebGPU in this browser)"}…`);
      const tokenizer = await AutoTokenizer.from_pretrained(id);
      const model = await AutoModelForCausalLM.from_pretrained(id, {
        dtype: "q4f16", device,
        progress_callback: (p) => { if (p.status === "progress" && p.total) status(`Loading the model… ${Math.round((100 * p.loaded) / p.total)}%`); },
      });
      state.loaded = { id, tokenizer, model };
      return state.loaded;
    }

    // The same prompt the target was trained on (target_prompt in notebook.py).
    function buildPrompt(tokenizer, request, known) {
      const references = known ? known.references : [];
      const refs = references.map((d) => `${d.title} (nushell)\n${d.text}`).join("\n\n");
      const text = (refs ? `\nSyntax references:\n${refs}\n\n` : "\n") + `Request: ${request}\nWorkspace: ${state.env.context}\nFiles: ${Object.keys(state.env.files).sort().join(", ")}`;
      const messages = [{ role: "system", content: format.system }, { role: "user", content: text }];
      return tokenizer.apply_chat_template(messages, { tools: format.tools, tokenize: false, add_generation_prompt: true, enable_thinking: false }) + format.assistant_prefix;
    }
    const callPattern = /^<function=run_nushell>\n<parameter=code>\n([\s\S]*)\n<\/parameter>\n<\/function>\n<\/tool_call>\s*$/;
    const partialCode = (text) => text.replace(/^<function=run_nushell>\n?(<parameter=code>\n?)?/, "").replace(/\n?<\/parameter>[\s\S]*$/, "");
    // Records compare by content, not by the order of their keys (the notebook scores the same way).
    const sorted = (v) => Array.isArray(v) ? v.map(sorted) : v && typeof v === "object" ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, sorted(v[k])])) : v;
    const sameValue = (a, b) => { try { return JSON.stringify(sorted(JSON.parse(a))) === JSON.stringify(sorted(JSON.parse(b))); } catch { return a.trim() === b.trim(); } };

    // The reference call, run here from the project root on the original files. (The value computed on disk
    // can differ in directory order and directory sizes, so it is only the fallback.)
    function referenceValue(known, cwd) {
      if (!known.code) return known.expected;
      const now = nu.get_files();
      nu.set_files(JSON.stringify(state.env.files));
      const reference = JSON.parse(nu.run(known.code));
      nu.set_files(now);
      const inside = (cwd || "").replace(/^\/workspace\/?/, "");
      if (inside) nu.session_run(`cd '${inside}'`);
      return reference.ok ? reference.stdout : known.expected;
    }

    async function ask(box, request) {
      const known = state.env.requests.find((r) => r.request === request);
      const { tokenizer, model } = await load(MODEL);
      const inputs = tokenizer(buildPrompt(tokenizer, request, known), { add_special_tokens: false });
      status("Writing the command…");
      const typed = prompt(box, "model", "who-nu", "");
      const code = typed.lastChild;
      let text = "";
      const started = performance.now();
      const streamer = new TextStreamer(tokenizer, { skip_prompt: true, skip_special_tokens: false, callback_function: (t) => { text += t; code.textContent = partialCode(text); $("scroll").scrollTop = $("scroll").scrollHeight; } });
      const output = await model.generate({ ...inputs, max_new_tokens: 220, do_sample: false, streamer });
      const tokens = output.dims[1] - inputs.input_ids.dims[1];
      const seconds = (performance.now() - started) / 1000;
      status(`${tokens} tokens in ${seconds.toFixed(1)} s · ${(tokens / seconds).toFixed(1)} tokens/s on ${device === "webgpu" ? "WebGPU" : "WebAssembly"}`);
      const call = text.replace(/<\|im_end\|>[\s\S]*$/, "").trim().match(callPattern);
      if (!call) {
        line(box, "The model did not produce a well-formed run_nushell call.", "err");
        return;
      }
      code.textContent = call[1];
      const result = runNu(box, call[1]);
      if (known && result.ok) {
        const same = sameValue(result.stdout, referenceValue(known, result.cwd));
        line(box, same ? "✓ same value as the reference answer" : "✗ runs, but the value differs from the reference answer", same ? "good" : "err");
      }
    }

    // ---- input ------------------------------------------------------------------------------------
    function setMode(mode) {
      state.mode = mode;
      $("mode").textContent = mode;
      $("mode").className = mode;
    }
    async function submit(text) {
      if (!text.trim() || state.busy) return;
      if (state.mode === "ask" && /^[1-9]$/.test(text.trim()) && state.choices[Number(text) - 1]) text = state.choices[Number(text) - 1].request;
      state.history.push(text);
      state.at = state.history.length;
      if (text.trim() === "clear") { $("scroll").textContent = ""; return; }
      const box = entry();
      state.busy = true;
      $("input").disabled = true;
      try {
        if (state.mode === "ask") {
          prompt(box, "you", "who-ask", text);
          await ask(box, text.trim());
        } else {
          prompt(box, cwd(), "who-nu", text);
          runNu(box, text);
        }
      } catch (err) {
        line(box, String(err?.message || err), "err");
        status("Error");
      } finally {
        state.busy = false;
        $("input").disabled = false;
        $("input").focus();
      }
    }
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { const text = $("input").value; $("input").value = ""; submit(text); }
      else if (e.key === "Tab") { e.preventDefault(); setMode(state.mode === "ask" ? "nu" : "ask"); }
      else if (e.key === "ArrowUp" && state.at > 0) { e.preventDefault(); $("input").value = state.history[--state.at]; }
      else if (e.key === "ArrowDown") { e.preventDefault(); state.at = Math.min(state.history.length, state.at + 1); $("input").value = state.history[state.at] ?? ""; }
    });
    $("mode").addEventListener("click", () => { setMode(state.mode === "ask" ? "nu" : "ask"); $("input").focus(); });

    // ---- start ------------------------------------------------------------------------------------
    const BANNER = String.raw`
 _   _                 _          _ _
| \ | |_   _       ___| |__   ___| | |
|  \| | | | |_____/ __| '_ \ / _ \ | |
| |\  | |_| |_____\__ \ | | |  __/ | |
|_| \_|\__,_|     |___/_| |_|\___|_|_|`;
    state.env = environments[0];
    nu.set_files(JSON.stringify(state.env.files));
    nu.session_reset();
    // a few held-out requests to try: short ones, each from a different kind of chain
    state.choices = state.env.requests.filter((r) => r.request.length < 110 && !/rewrite|one line|exactly as written/i.test(r.request)).filter((_, i) => i % 7 === 0).slice(0, 5);
    const top = entry();
    line(top, BANNER.slice(1), "banner");
    const list = entry();
    state.choices.forEach((r, i) => {
      const el = line(list, "", "choice");
      const n = document.createElement("b");
      n.textContent = `${i + 1}  `;
      el.append(n, document.createTextNode(r.request));
      el.addEventListener("click", () => { setMode("ask"); submit(r.request); });
    });
    $("input").focus();
    if (new URLSearchParams(location.search).has("load")) {  // opened from the notebook: fetch the model straight away
      load(MODEL).then(() => status(""), (err) => status(`model failed to load: ${err.message || err}`));
    }
    window.demo = { submit, setMode, state };  // for automated checks
  </script>
</body>
</html>
